<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabelGuard</title>
<style>
:root{--text:#212529;--muted:#667085;--border:rgba(80,90,110,.20)}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:transparent}
.figure{width:100%;max-width:1100px;margin:auto}.canvas{position:relative;padding:18px 16px 14px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(135deg,rgba(248,249,250,.8),rgba(255,255,255,.98));overflow:hidden}
.flow{display:grid;grid-template-columns:1.05fr .22fr 1.25fr .22fr 1.15fr .22fr 1.1fr;gap:7px;align-items:center}
.node{min-height:116px;padding:12px;border:1px solid var(--border);border-radius:11px;background:rgba(255,255,255,.94);cursor:pointer;transition:.18s ease}
.node:hover,.node.active{transform:translateY(-3px);box-shadow:0 8px 24px rgba(30,40,60,.11);border-color:rgba(70,90,120,.42)}
.icon{width:34px;height:34px;margin-bottom:7px;opacity:.82}.title{font-size:.83rem;font-weight:720}.sub{font-size:.68rem;line-height:1.35;color:var(--muted);margin-top:3px}
.dim{display:inline-block;margin-top:7px;padding:3px 6px;border-radius:5px;background:rgba(90,100,120,.07);font-size:.62rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.arrow{text-align:center;font-size:1.05rem;opacity:.4}.score{text-align:center;display:flex;flex-direction:column;justify-content:center}
.p{font-size:1.55rem;font-weight:750;line-height:1}.range{font-size:.63rem;color:var(--muted);margin-top:5px}
.gauge{height:6px;border-radius:5px;margin:10px 2px 5px;background:linear-gradient(90deg,rgba(80,130,190,.25) 0 70%,rgba(160,90,130,.25) 70% 100%);position:relative}.threshold{position:absolute;left:70%;top:-4px;height:14px;width:1px;background:currentColor;opacity:.55}
.threshold-label{font-size:.57rem;color:var(--muted)}.legend{display:flex;justify-content:space-between;margin-top:10px;padding:0 4px;font-size:.64rem;color:var(--muted)}
.tooltip{position:absolute;display:none;width:min(330px,75vw);padding:12px 14px;border-radius:10px;background:rgba(30,35,45,.97);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:.72rem;line-height:1.48;z-index:20;pointer-events:none}.tooltip.show{display:block}.tooltip strong{display:block;font-size:.8rem;margin-bottom:4px}
@media(max-width:750px){.canvas{overflow-x:auto}.flow{min-width:780px}}
</style>
</head>
<body>
<div class="figure"><div class="canvas">
<div class="flow">

<div class="node" data-title="1 · Libellé textuel" data-text="LabelGuard reçoit le libellé à analyser, qu'il provienne de la base réelle ou d'une génération synthétique.">
<svg class="icon" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="7" y="8" width="26" height="24" rx="3"/><path d="M12 15h16M12 20h12M12 25h8"/></svg>
<div class="title">Libellé</div><div class="sub">Texte original ou synthétique</div>
</div>

<div class="arrow">→</div>

<div class="node" data-title="2 · Représentation vectorielle" data-text="Le texte est transformé en représentation vectorielle dense avec Qwen/Qwen3-Embedding-8B. Chaque libellé est représenté dans un espace de 4096 dimensions.">
<svg class="icon" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="20" r="3"/><circle cx="20" cy="12" r="3"/><circle cx="30" cy="20" r="3"/><circle cx="20" cy="28" r="3"/><path d="M13 18l4-4M23 14l4 4M27 22l-4 4M17 26l-4-4"/></svg>
<div class="title">Embedding</div><div class="sub">Qwen/Qwen3-Embedding-8B</div><span class="dim">4096 dimensions</span>
</div>

<div class="arrow">→</div>

<div class="node" data-title="3 · Discriminateur MLP" data-text="Le vecteur est transmis au perceptron multicouche retenu après comparaison de plusieurs architectures.">
<svg class="icon" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="20" r="3"/><circle cx="20" cy="10" r="3"/><circle cx="20" cy="30" r="3"/><circle cx="31" cy="20" r="3"/><path d="M12 19l5-7M12 21l5 7M23 12l5 6M23 28l5-6"/></svg>
<div class="title">LabelGuard</div><div class="sub">Perceptron multicouche</div><span class="dim">4096 → 1024 → 256 → 1</span>
</div>

<div class="arrow">→</div>

<div class="node score" data-title="4 · Score de discrimination" data-text="Le modèle retourne une valeur entre 0 et 1. Une valeur proche de 0 correspond à un libellé jugé humain ; une valeur proche de 1 à un libellé jugé généré par IA. Le seuil utilisé est 0,70.">
<div class="p">p</div><div class="range">score ∈ [0 ; 1]</div>
</div>
</div>

</div>
<div class="tooltip" id="tooltip"></div>
</div>
<script>
(() => {
 const root=document.querySelector(".figure"),tip=document.getElementById("tooltip"),nodes=root.querySelectorAll(".node");
 function show(n){tip.innerHTML="<strong>"+n.dataset.title+"</strong>"+n.dataset.text;
   const r=n.getBoundingClientRect(),rr=root.getBoundingClientRect();let x=r.left-rr.left+r.width/2,y=r.bottom-rr.top+8;
   x=Math.max(12,Math.min(x,rr.width-165));tip.style.left=x+"px";tip.style.top=y+"px";tip.style.transform="translateX(-50%)";tip.classList.add("show");n.classList.add("active");}
 function hide(){tip.classList.remove("show");nodes.forEach(n=>n.classList.remove("active"));}
 nodes.forEach(n=>{n.addEventListener("mouseenter",()=>show(n));n.addEventListener("mouseleave",hide);
   n.addEventListener("click",e=>{e.stopPropagation();if(n.classList.contains("active"))hide();else{hide();show(n)}});});
 document.addEventListener("click",hide);
})();
</script>
</body>
</html>
